[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfinder"
version = "0.1.0"
description = "Job finder powered by the Affine-S6 Hugging Face model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Job-finder" }]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.7",
    "huggingface-hub>=0.26",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers>=4.51.0",
    "accelerate",
]
humanizer = [
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jobfinder = "jobfinder.cli:main"

[project.urls]
Model = "https://huggingface.co/WebScraper991923/Affine-S6"
Humanizer = "https://huggingface.co/mradermacher/Ai-Humanizer-Llama-3.2-3B-GGUF"

[tool.setuptools.packages.find]
include = ["jobfinder*"]

[tool.setuptools.package-data]
jobfinder = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
